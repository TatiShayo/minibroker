[package]
name = "minibroker"
version = "0.1.0"
edition = "2021"
description = "High-throughput append-only distributed message broker"

[[bin]]
name = "minibroker"
path = "rust_src/src/main.rs"

[lib]
name = "minibroker_lib"
path = "rust_src/src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
